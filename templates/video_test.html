<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Feed Test</title>
<style>body{margin:0;background:#07101b;color:#eaf4ff;font-family:Segoe UI,Arial;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.card{border:1px solid #2b4058;border-radius:10px;overflow:hidden;background:#0e1a28}.head{padding:10px 12px;display:flex;justify-content:space-between}.frame{aspect-ratio:16/9}.frame iframe{width:100%;height:100%;border:0}.foot{padding:10px 12px;font-size:12px;color:#9ab0c7}.live{color:#45e08c}.wait{color:#ffbf5e}button,a{background:#17283d;color:#fff;border:1px solid #304a67;border-radius:6px;padding:6px 9px;text-decoration:none;font-size:12px}.controls{display:flex;gap:6px}</style></head>
<body><h1>VDO.Ninja Feed Test</h1><p>Use this page before the exhibition dashboard. If the feed works here, the dashboard can display it.</p>
<div class="grid">
<div class="card"><div class="head"><b>Robot</b><span id="rs" class="wait">Checking…</span></div><div class="frame"><iframe id="r" src="{{robot_view_url}}" allow="autoplay;fullscreen;picture-in-picture;camera;microphone;display-capture" allowfullscreen></iframe></div><div class="foot"><div>{{robot_stream_id}}</div><div class="controls"><a href="{{robot_view_url}}" target="_blank">Open direct viewer</a><button onclick="reload('r')">Reconnect</button></div></div></div>
<div class="card"><div class="head"><b>Software screen</b><span id="ss" class="wait">Checking…</span></div><div class="frame"><iframe id="s" src="{{software_view_url}}" allow="autoplay;fullscreen;picture-in-picture;camera;microphone;display-capture" allowfullscreen></iframe></div><div class="foot"><div>{{software_stream_id}}</div><div class="controls"><a href="{{software_view_url}}" target="_blank">Open direct viewer</a><button onclick="reload('s')">Reconnect</button></div></div></div></div>
<p>Browser test result: <span id="diag">waiting for VDO.Ninja messages…</span></p>
<script>
const pairs=[['r','rs'],['s','ss']];
function reload(id){const f=document.getElementById(id);const u=f.src;f.src='about:blank';setTimeout(()=>f.src=u,150)}
window.addEventListener('message',e=>{for(const [fid,sid] of pairs){const f=document.getElementById(fid);if(e.source!==f.contentWindow)continue;const d=e.data||{};if(d.action==='guest-connected'||d.action==='video-play'||d.action==='stream-added'||(Array.isArray(d.streamIDs)&&d.streamIDs.length)){document.getElementById(sid).textContent='LIVE';document.getElementById(sid).className='live';document.getElementById('diag').textContent='A VDO.Ninja stream connection was reported.'}}});
for(const [fid] of pairs){const f=document.getElementById(fid);f.addEventListener('load',()=>{setTimeout(()=>f.contentWindow.postMessage({getDetailedState:true},'*'),1000)});}
</script></body></html>
